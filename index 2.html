<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf8f4"><title>旅のきろく。</title>
<style>
:root{--ink:#303844;--muted:#7c8792;--paper:#faf8f4;--line:#e9e3da;--blue:#9dbbd8;--pink:#e8b7c7;--purple:#bdb0d9}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}
main{max-width:900px;margin:auto;padding:28px 18px 90px}.brand{font:28px "Yu Mincho",serif;letter-spacing:.12em}.sub{font-size:10px;letter-spacing:.2em;color:var(--muted)}
h1{font:500 30px "Yu Mincho",serif}.lead,.hint{font-size:13px;line-height:1.8;color:var(--muted)}
.card{background:white;border:1px solid var(--line);border-radius:22px;padding:18px;margin:18px 0;box-shadow:0 8px 24px #5b51450a}
.head{display:flex;justify-content:space-between;align-items:center}.head h2{font-size:15px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
japan-prefecture-map{display:block;width:100%;--jpm-surface:#ffffff;--jpm-surface-raised:#faf8f4;--jpm-text:#303844;--jpm-muted:#7c8792;--jpm-border:#e9e3da;--jpm-accent:#9bafc4;--jpm-level-0:#e8e7e3;--jpm-level-0-stripe:transparent;--jpm-level-1:#9dbbd8;--jpm-level-2:#e8b7c7;--jpm-level-3:#bdb0d9;--jpm-level-4:#bdb0d9;--jpm-level-5:#a9c4b2;--jpm-map-glow:none}
japan-prefecture-map::part(summary),japan-prefecture-map::part(legend){display:none}
#map{min-height:260px;display:grid;place-items:center}
select,input,textarea,button{font:inherit}select,input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;margin:6px 0 12px;background:white;color:var(--ink)}textarea{min-height:80px}
.states{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.states button{padding:12px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink)}
.primary{width:100%;background:var(--ink);color:white;border:0;border-radius:12px;padding:13px}
#editor{display:none}#editor.show{display:block}.record{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;font-size:12px}.record p{white-space:pre-wrap;color:var(--muted)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fffe;border-top:1px solid var(--line);display:flex;justify-content:center;gap:30px;padding:14px;font-size:11px;color:var(--muted)}
@media(min-width:700px){main{padding:40px 24px 100px}#map{min-height:400px}}
</style>
<script type="module" src="https://cdn.jsdelivr.net/npm/japan-prefecture-map@0.3.0/dist/index.js"></script>
</head>
<body><main>
<header class="head"><div><div class="brand">旅のきろく。</div><div class="sub">TRAVEL NOTES</div></div><span class="sub">MY TRAVEL MAP ✳</span></header>
<p class="sub">YOUR JOURNEY, YOUR STORY</p><h1>行った場所が、思い出になる。</h1><p class="lead">47都道府県を塗り分けながら、旅の記録を残そう。</p>
<section class="card"><div class="head"><h2>日本地図</h2><span class="sub">47 PREFECTURES</span></div>
<div class="legend"><span><i class="dot" style="background:var(--blue)"></i>自分</span><span><i class="dot" style="background:var(--pink)"></i>相手</span><span><i class="dot" style="background:var(--purple)"></i>一緒</span><span><i class="dot" style="background:#e8e7e3"></i>未訪問</span></div>
<div id="map"><japan-prefecture-map id="jmap" locale="ja" theme="light" levels="{}"></japan-prefecture-map></div>
<p class="hint" id="mapstatus">地図を準備しています。県名一覧からも選択できます。</p>
<p class="hint">地図データ：Japan Prefecture Map / JapanEx（MIT License）</p></section>
<section class="card"><div class="head"><h2>県の記録</h2><span class="sub">PREFECTURE ALBUM</span></div>
<label for="pref">都道府県</label><select id="pref"><option value="">県を選択</option></select>
<div id="editor"><div class="states"><button data-state="0">未訪問</button><button data-state="1">自分だけ</button><button data-state="2">相手だけ</button><button data-state="3">一緒</button></div>
<label for="date">訪問日</label><input id="date" type="date"><label for="memo">旅のメモ</label><textarea id="memo" placeholder="旅の思い出を残そう"></textarea>
<button class="primary" id="save">この県の記録を保存</button></div></section>
<section class="card"><div class="head"><h2>旅の記録一覧</h2><span class="sub">MY FOOTPRINT</span></div><div id="records" class="hint">まだ記録はありません。</div></section>
</main><nav><span>◎ マップ</span><span>▤ 記録</span><span>▧ アルバム</span><span>♡ グループ</span><span>⚙ 設定</span></nav>
<script>
const names=["北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県","茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県","新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県","三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県","鳥取県","島根県","岡山県","広島県","山口県","徳島県","香川県","愛媛県","高知県","福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"];
const codes=names.map((_,i)=>String(i+1).padStart(2,"0")),sel=document.querySelector("#pref"),map=document.querySelector("#jmap"),editor=document.querySelector("#editor");
names.forEach((n,i)=>sel.add(new Option(n,String(i+1))));
let records={};try{records=JSON.parse(localStorage.getItem("tabiRecords")||"{}")}catch(e){}let current="";
function levels(){const x={};Object.entries(records).forEach(([k,v])=>{if(+v.state>0)x[codes[+k-1]]=+v.state});return x}
function render(){if(map)map.setAttribute("levels",JSON.stringify(levels()));const box=document.querySelector("#records");box.innerHTML="";const rows=Object.entries(records).filter(([k,v])=>v.date||v.memo||+v.state);if(!rows.length){box.textContent="まだ記録はありません。";return}rows.sort((a,b)=>+a[0]-+b[0]).forEach(([k,v])=>{const d=document.createElement("div");d.className="record";const s=["未訪問","自分だけ","相手だけ","一緒"][+v.state||0];d.innerHTML="<b>"+names[+k-1]+"</b><div>"+s+" ・ "+(v.date||"日付なし")+"</div><p></p>";d.querySelector("p").textContent=v.memo||"";box.append(d)})}
function choose(n){current=String(n);sel.value=current;editor.classList.add("show");document.querySelector("#date").value=records[current]?.date||"";document.querySelector("#memo").value=records[current]?.memo||"";editor.scrollIntoView({behavior:"smooth",block:"nearest"})}
sel.addEventListener("change",()=>sel.value?choose(sel.value):editor.classList.remove("show"));
document.querySelectorAll("[data-state]").forEach(b=>b.addEventListener("click",()=>{if(!current)return;records[current]={...(records[current]||{}),state:+b.dataset.state};render()}));
document.querySelector("#save").addEventListener("click",()=>{if(!current)return;records[current]={...(records[current]||{}),state:records[current]?.state??0,date:document.querySelector("#date").value,memo:document.querySelector("#memo").value};localStorage.setItem("tabiRecords",JSON.stringify(records));render();alert(names[+current-1]+"の記録を保存したよ！")});
map.addEventListener("click",e=>{for(const el of(e.composedPath?.()||[])){const c=el?.dataset?.code||el?.dataset?.prefectureCode;if(c){const n=+c;if(n>=1&&n<=47)choose(n);break}}});
customElements.whenDefined("japan-prefecture-map").then(()=>{document.querySelector("#mapstatus").textContent="地図を読み込みました。県名一覧から選択して記録できます。";render()}).catch(()=>{document.querySelector("#mapstatus").textContent="地図を読み込めない場合は、県名一覧から選択できます。"});
render();
</script></body></html>
